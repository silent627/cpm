openapi: 3.0.3
info:
  title: 社区人口管理系统 API
  description: |
    社区人口管理系统（Community Population Management System，CPM）是一个基于 Spring Cloud 微服务架构开发的社区人口信息管理平台。
    
    ## 技术栈
    - Spring Boot 2.7.6
    - Spring Cloud Gateway（API网关）
    - MyBatis-Plus 3.5.3
    - Redis（缓存和Token存储）
    - Elasticsearch（全文搜索）
    - JWT 认证
    - Knife4j (Swagger) 3.0.3
    
    ## 微服务架构
    - **cpm-user-service**: 用户服务（认证、用户管理、管理员管理、行政区划）
    - **cpm-resident-service**: 居民服务
    - **cpm-household-service**: 户籍服务（户籍管理、户籍成员管理）
    - **cpm-file-service**: 文件服务（文件上传、文件管理）
    - **cpm-notification-service**: 通知服务（邮件、验证码）
    - **cpm-search-service**: 搜索服务（Elasticsearch全文检索）
    - **cpm-statistics-service**: 统计服务（数据统计）
  version: 2.0.0
  contact:
    name: wuzuhao
servers:
  - url: http://localhost:8080
    description: 开发环境
  - url: https://api.example.com
    description: 生产环境

security:
  - bearerAuth: []

tags:
  - name: 认证管理
    description: 用户登录、登出、忘记密码等功能
  - name: 用户管理
    description: 用户注册、信息管理、批量操作等功能
  - name: 系统管理员管理
    description: 管理员信息管理
  - name: 居民管理
    description: 居民信息管理、导入导出等功能
  - name: 户籍管理
    description: 户籍信息管理
  - name: 户籍成员管理
    description: 户籍成员关系管理
  - name: 文件上传管理
    description: 文件上传、删除等功能
  - name: 通知服务
    description: 邮件发送、验证码管理
  - name: 验证码管理
    description: 图形验证码生成和验证
  - name: 搜索服务
    description: Elasticsearch全文检索
  - name: 统计服务
    description: 数据统计分析
  - name: 行政区划管理
    description: 行政区划数据查询

paths:
  # ==================== 认证管理 ====================
  /api/auth/login:
    post:
      tags:
        - 认证管理
      summary: 用户登录
      description: 使用用户名和密码登录，返回JWT Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                code: 200
                message: 登录成功
                data:
                  token: eyJhbGciOiJIUzUxMiJ9...
                  userId: 1
                  username: admin
                  role: ADMIN
                  realName: 系统管理员
        '500':
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                code: 500
                message: 用户名或密码错误
                data: null

  /api/auth/logout:
    post:
      tags:
        - 认证管理
      summary: 用户登出
      description: 退出登录，清除Token
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/auth/forget-password/send-code:
    post:
      tags:
        - 认证管理
      summary: 发送忘记密码验证码
      description: 向指定邮箱发送验证码，用于重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/auth/forget-password/verify-code:
    post:
      tags:
        - 认证管理
      summary: 验证忘记密码验证码
      description: 验证邮箱验证码是否正确（仅验证，不删除验证码）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        '200':
          description: 验证码正确
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/auth/forget-password/reset:
    post:
      tags:
        - 认证管理
      summary: 重置密码（忘记密码）
      description: 通过邮箱验证码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ==================== 用户管理 ====================
  /api/user/register:
    post:
      tags:
        - 用户管理
      summary: 用户注册
      description: 新用户注册，无需登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            example:
              username: testuser
              password: 123456
              realName: 测试用户
              phone: 13800138000
              email: test@example.com
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/info:
    get:
      tags:
        - 用户管理
      summary: 获取当前用户信息
      description: 获取当前登录用户的信息
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/update:
    put:
      tags:
        - 用户管理
      summary: 更新用户信息
      description: 更新当前登录用户的信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                realName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/change-password/send-code:
    post:
      tags:
        - 用户管理
      summary: 发送修改密码验证码
      description: 向当前用户邮箱发送验证码，用于修改密码
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/change-password:
    post:
      tags:
        - 用户管理
      summary: 修改密码
      description: 修改当前登录用户的密码，支持两种方式：1. 通过旧密码验证 2. 通过邮箱验证码验证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                oldPassword:
                  type: string
                emailCode:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/all:
    get:
      tags:
        - 用户管理
      summary: 获取所有用户列表
      description: 获取所有用户信息，用于搜索服务索引同步（内部接口）
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/list:
    get:
      tags:
        - 用户管理
      summary: 分页查询用户列表
      description: 管理员功能，使用Elasticsearch全文检索查询用户信息
      parameters:
        - name: current
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: username
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [USER, ADMIN]
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/{id}:
    get:
      tags:
        - 用户管理
      summary: 根据ID获取用户
      description: 管理员功能，根据用户ID获取用户信息
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    put:
      tags:
        - 用户管理
      summary: 更新用户信息（管理员）
      description: 管理员功能，根据用户ID更新用户信息
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                realName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    delete:
      tags:
        - 用户管理
      summary: 删除用户
      description: 管理员功能，逻辑删除用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/status/{id}:
    put:
      tags:
        - 用户管理
      summary: 更新用户状态
      description: 管理员功能，启用或禁用用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  enum: [0, 1]
                  description: 0-禁用, 1-启用
      responses:
        '200':
          description: 状态更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/batch/delete:
    post:
      tags:
        - 用户管理
      summary: 批量删除用户
      description: 管理员功能，批量删除用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: 批量删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/user/export:
    get:
      tags:
        - 用户管理
      summary: 导出用户列表
      description: 管理员功能，导出用户列表为Excel文件，支持筛选条件
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Excel文件流
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token认证，格式：Bearer {token}

  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          description: 状态码，200表示成功，其他表示失败
        message:
          type: string
          description: 响应消息
        data:
          description: 响应数据，泛型类型
      required:
        - code
        - message

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 密码
          format: password

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          description: 用户名（唯一）
        password:
          type: string
          format: password
        realName:
          type: string
          description: 真实姓名
        phone:
          type: string
          description: 手机号
        email:
          type: string
          format: email
          description: 邮箱
        role:
          type: string
          enum: [USER, ADMIN]
          description: 角色
        status:
          type: integer
          enum: [0, 1]
          description: 状态：0-禁用, 1-启用
        avatar:
          type: string
          description: 头像URL
        createTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time

    Page:
      type: object
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        size:
          type: integer
        current:
          type: integer
        pages:
          type: integer
